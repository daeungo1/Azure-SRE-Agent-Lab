# MkDocs base configuration.
#
# The `nav:` section is intentionally absent — scripts/build-site.py generates it from
# the repository's canonical Markdown files and writes the final .site/mkdocs.yml.

site_name: Azure SRE Agent Lab
site_description: Azure SRE Agent 기능 소개 · 한국어 실습 Lab · E2E 검증 결과 · 포털 기능 구성
site_author: daeungo1
site_url: https://daeungo1.github.io/Azure-SRE-Agent-Lab/

repo_url: https://github.com/daeungo1/Azure-SRE-Agent-Lab
repo_name: daeungo1/Azure-SRE-Agent-Lab
edit_uri: ""

docs_dir: docs
site_dir: site

theme:
  name: material
  language: ko
  icon:
    repo: fontawesome/brands/github
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.indexes
    - navigation.top
    - navigation.tracking
    - toc.follow
    - content.code.copy
    - search.suggest
    - search.highlight
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: 다크 모드로 전환
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: 라이트 모드로 전환

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - md_in_html
  - tables
  - footnotes
  # Unicode slugs keep the GitHub-style Korean anchors used throughout the docs.
  - toc:
      permalink: true
      slugify: !!python/name:pymdownx.slugs.uslugify
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true

plugins:
  # lunr has no Korean stemmer; a wider separator at least tokenises on punctuation.
  - search:
      separator: '[\s\u3000\u200b\-_,:!=\[\]()"`/]+|\.(?!\d)|&[lg]t;'

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/daeungo1/Azure-SRE-Agent-Lab
      name: GitHub 저장소

copyright: Azure SRE Agent Lab — 워크숍 실습 자료
