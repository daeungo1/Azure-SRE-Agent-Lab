<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 560" font-family="Segoe UI, Malgun Gothic, 맑은 고딕, -apple-system, sans-serif">
  <defs>
    <filter id="k1" x="-4%" y="-8%" width="108%" height="120%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-opacity="0.10"/>
    </filter>
    <marker id="ka" markerWidth="9" markerHeight="7" refX="9" refY="3.5" orient="auto"><path d="M0,0 L9,3.5 L0,7 Z" fill="#0078d4"/></marker>
  </defs>

  <rect width="1020" height="560" rx="12" fill="#f7f9fb"/>
  <text x="510" y="34" text-anchor="middle" font-size="19" font-weight="700" fill="#12314e">Knowledge Sources — 지식을 붙이는 네 가지 경로</text>
  <text x="510" y="56" text-anchor="middle" font-size="12" fill="#5a6b7b">모두 하나의 인덱스로 모여 함께 검색되고, 답변에는 출처가 붙습니다</text>

  <!-- 경로 1: 파일 -->
  <rect x="16" y="80" width="238" height="176" rx="10" fill="#ffffff" stroke="#008272" stroke-width="1.5" filter="url(#k1)"/>
  <rect x="16" y="80" width="238" height="30" rx="10" fill="#e6f4f1"/>
  <rect x="16" y="100" width="238" height="10" fill="#e6f4f1"/>
  <text x="135" y="101" text-anchor="middle" font-size="12" font-weight="700" fill="#006b5d">① 파일 업로드</text>
  <text x="135" y="130" text-anchor="middle" font-size="10" fill="#4a6b66">Builder ▸ Add file</text>
  <rect x="30" y="142" width="210" height="46" rx="6" fill="#f2fbf9" stroke="#008272" stroke-width="0.9"/>
  <text x="135" y="160" text-anchor="middle" font-size="9.2" fill="#4a6b66">런북 · 아키텍처 · 절차서</text>
  <text x="135" y="177" text-anchor="middle" font-size="9.2" fill="#4a6b66">28종 형식 · 16MB/파일</text>
  <text x="135" y="208" text-anchor="middle" font-size="9.2" font-weight="700" fill="#006b5d">정적 · 스냅샷</text>
  <text x="135" y="228" text-anchor="middle" font-size="8.6" fill="#7d9a95">폴더 업로드 시 계층은 평탄화</text>
  <text x="135" y="243" text-anchor="middle" font-size="8.6" fill="#7d9a95">동명 파일은 첫 번째만 남음</text>

  <!-- 경로 2: 웹 페이지 -->
  <rect x="266" y="80" width="238" height="176" rx="10" fill="#ffffff" stroke="#0078d4" stroke-width="1.5" filter="url(#k1)"/>
  <rect x="266" y="80" width="238" height="30" rx="10" fill="#e5f1fb"/>
  <rect x="266" y="100" width="238" height="10" fill="#e5f1fb"/>
  <text x="385" y="101" text-anchor="middle" font-size="12" font-weight="700" fill="#005a9e">② 웹 페이지 URL</text>
  <text x="385" y="130" text-anchor="middle" font-size="10" fill="#33689e">Builder ▸ Add web page</text>
  <rect x="280" y="142" width="210" height="46" rx="6" fill="#f4f9fd" stroke="#0078d4" stroke-width="0.9"/>
  <text x="385" y="160" text-anchor="middle" font-size="9.2" fill="#33689e">공개 문서 · 벤더 가이드</text>
  <text x="385" y="177" text-anchor="middle" font-size="9.2" fill="#33689e">사내 포털(도달 가능한 경우)</text>
  <text x="385" y="208" text-anchor="middle" font-size="9.2" font-weight="700" fill="#005a9e">URL 하나 = 지식 하나</text>
  <text x="385" y="228" text-anchor="middle" font-size="8.6" fill="#7d94ab">인증이 필요한 페이지는 부적합</text>
  <text x="385" y="243" text-anchor="middle" font-size="8.6" fill="#7d94ab">대량 등록에는 맞지 않음</text>

  <!-- 경로 3: 커넥터 -->
  <rect x="516" y="80" width="238" height="176" rx="10" fill="#ffffff" stroke="#5c2d91" stroke-width="1.8" filter="url(#k1)"/>
  <rect x="516" y="80" width="238" height="30" rx="10" fill="#f0eaf8"/>
  <rect x="516" y="100" width="238" height="10" fill="#f0eaf8"/>
  <text x="635" y="101" text-anchor="middle" font-size="12" font-weight="700" fill="#4a2378">③ 문서 커넥터</text>
  <text x="635" y="130" text-anchor="middle" font-size="10" fill="#6b5a86">Builder ▸ Connectors</text>
  <rect x="530" y="142" width="210" height="46" rx="6" fill="#faf7fe" stroke="#5c2d91" stroke-width="0.9"/>
  <text x="635" y="160" text-anchor="middle" font-size="9.2" fill="#6b5a86">Azure DevOps Wiki · Git</text>
  <text x="635" y="177" text-anchor="middle" font-size="9.2" fill="#6b5a86">GitHub 저장소 · 위키</text>
  <text x="635" y="208" text-anchor="middle" font-size="9.2" font-weight="700" fill="#4a2378">살아 있는 지식 · 24시간 재크롤</text>
  <text x="635" y="228" text-anchor="middle" font-size="8.6" fill="#8d7fa6">URL 에 pageId 를 넣어 서브트리만 색인</text>
  <text x="635" y="243" text-anchor="middle" font-size="8.6" fill="#8d7fa6">15종 텍스트 형식</text>

  <!-- 경로 4: MCP -->
  <rect x="766" y="80" width="238" height="176" rx="10" fill="#ffffff" stroke="#c19c00" stroke-width="1.5" filter="url(#k1)"/>
  <rect x="766" y="80" width="238" height="30" rx="10" fill="#fff8e6"/>
  <rect x="766" y="100" width="238" height="10" fill="#fff8e6"/>
  <text x="885" y="101" text-anchor="middle" font-size="12" font-weight="700" fill="#8a6d00">④ MCP 서버</text>
  <text x="885" y="130" text-anchor="middle" font-size="10" fill="#7a6200">Builder ▸ Connectors ▸ MCP</text>
  <rect x="780" y="142" width="210" height="46" rx="6" fill="#fffdf5" stroke="#c19c00" stroke-width="0.9"/>
  <text x="885" y="160" text-anchor="middle" font-size="9.2" fill="#7a6200">Azure AI Search · GraphDB</text>
  <text x="885" y="177" text-anchor="middle" font-size="9.2" fill="#7a6200">Confluence · SharePoint · CMDB</text>
  <text x="885" y="208" text-anchor="middle" font-size="9.2" font-weight="700" fill="#8a6d00">색인이 아니라 질의</text>
  <text x="885" y="228" text-anchor="middle" font-size="8.6" fill="#9a8330">원본 시스템이 검색을 담당</text>
  <text x="885" y="243" text-anchor="middle" font-size="8.6" fill="#9a8330">도구 예산 80개를 함께 소비</text>

  <line x1="135" y1="262" x2="420" y2="292" stroke="#0078d4" stroke-width="1.4" marker-end="url(#ka)"/>
  <line x1="385" y1="262" x2="470" y2="292" stroke="#0078d4" stroke-width="1.4" marker-end="url(#ka)"/>
  <line x1="635" y1="262" x2="550" y2="292" stroke="#0078d4" stroke-width="1.4" marker-end="url(#ka)"/>
  <line x1="885" y1="262" x2="600" y2="292" stroke="#0078d4" stroke-width="1.4" marker-end="url(#ka)"/>

  <!-- 통합 검색 -->
  <rect x="290" y="298" width="440" height="72" rx="10" fill="#e5f1fb" stroke="#0078d4" stroke-width="1.8" filter="url(#k1)"/>
  <text x="510" y="326" text-anchor="middle" font-size="13" font-weight="700" fill="#005a9e">하나의 검색으로 모두 조회</text>
  <text x="510" y="348" text-anchor="middle" font-size="9.5" fill="#33689e">①②③ 은 청크로 쪼개 임베딩 후 의미 검색 · ④ 는 도구 호출로 실시간 질의</text>
  <text x="510" y="363" text-anchor="middle" font-size="9" fill="#7d94ab">여기에 과거 인시던트 기억과 사용자 메모리가 함께 검색됩니다</text>

  <line x1="510" y1="372" x2="510" y2="392" stroke="#0078d4" stroke-width="1.8" marker-end="url(#ka)"/>

  <rect x="290" y="398" width="440" height="52" rx="10" fill="#ffffff" stroke="#008272" stroke-width="1.5" filter="url(#k1)"/>
  <text x="510" y="422" text-anchor="middle" font-size="12" font-weight="700" fill="#006b5d">근거 + 출처(citation) 가 붙은 답변</text>
  <text x="510" y="440" text-anchor="middle" font-size="9" fill="#4a6b66">인용을 클릭하면 원본 문서·위키 페이지로 이동합니다</text>

  <!-- 하단 주의 -->
  <rect x="16" y="466" width="988" height="78" rx="10" fill="#fff8e6" stroke="#c19c00" stroke-width="1.3"/>
  <text x="510" y="490" text-anchor="middle" font-size="11.5" font-weight="700" fill="#8a6d00">계층이 복잡한 것보다, 오래된 문서가 훨씬 위험합니다</text>
  <text x="510" y="512" text-anchor="middle" font-size="10" fill="#7a6200">검색은 폴더 트리를 타지 않고 의미로 찾으므로 계층 깊이는 문제가 되지 않습니다.</text>
  <text x="510" y="531" text-anchor="middle" font-size="10" fill="#7a6200">반면 오래된 문서는 그대로 틀린 답의 근거가 됩니다 — 넣는 양보다 <tspan font-weight="700">최신성 관리</tspan>가 관건입니다.</text>
</svg>
