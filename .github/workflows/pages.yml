name: Deploy docs to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "OVERVIEW.md"
      - "README.md"
      - "SRE_Agent.md"
      - "features-sre/README.md"
      - "docs/**"
      - "mkdocs.base.yml"
      - "scripts/build-site.py"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install "mkdocs-material>=9.5,<10"

      - name: Generate site sources from the canonical Markdown
        run: python scripts/build-site.py

      - name: Build site
        run: mkdocs build --strict -f .site/mkdocs.yml

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .site/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
